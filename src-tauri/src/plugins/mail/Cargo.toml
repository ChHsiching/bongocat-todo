[package]
name = "tauri-plugin-mail"
version = "0.1.0"
authors = []
description = ""
edition = "2024"
rust-version = "1.85.0"
links = "tauri-plugin-mail"

[dependencies]
tauri.workspace = true
serde.workspace = true
# IMAP 协议 + IDLE（async-imap 自身不处理 TLS，需先建立加密连接再传给 Client::new）
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# TLS：native-tls（tokio 异步封装），覆盖 Gmail/QQ/163 等主流邮箱的 IMAPS
tokio-native-tls = "0.3"
native-tls = "0.2"
# 异步运行时（IDLE task 需要 rt-multi-thread + 时间工具）
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
# 异步流处理（fetch 结果 collect）
futures-lite = "2"
# OS 钥匙串（密码不落地明文）。⚠️ v4 + v1 feature，API 是 keyring::v1::Entry（非顶层）
keyring = { version = "4", features = ["v1"] }
# 日志 facade（tauri-plugin-log 后端）
log.workspace = true

[build-dependencies]
tauri-plugin.workspace = true
