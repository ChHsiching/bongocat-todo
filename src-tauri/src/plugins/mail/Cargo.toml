[package]
name = "tauri-plugin-mail"
version = "0.1.0"
authors = []
description = ""
edition = "2024"
rust-version = "1.85.0"
links = "tauri-plugin-mail"

[dependencies]
tauri.workspace = true
serde.workspace = true
# IMAP protocol + IDLE (async-imap does not handle TLS itself; establish the encrypted connection first, then pass it to Client::new)
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# TLS: rustls (pure Rust TLS, no certificate revocation checks). native-tls goes through SChannel on Windows,
# which enables OCSP/CRL revocation checks by default and fails the handshake when the revocation servers are unreachable
# on domestic networks (CRYPT_E_REVOCATION_OFFLINE).
# rustls skips revocation checks by default, avoiding that issue, and has no OpenSSL/SChannel system dependencies.
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "0.26"
# HTTP CONNECT + SOCKS5 proxy (bypasses the TUN system stack's unstable forwarding of non-standard ports;
# lets the program tunnel to the IMAP server through mihomo/clash's mixed-port proxy)
async-http-proxy = { version = "1", default-features = false, features = ["runtime-tokio"] }
# MIME encoded-word decoding (mail subjects, RFC 2047 `=?utf-8?B?...?=`)
base64 = "0.22"
# Async runtime (the IDLE task needs rt-multi-thread + time utilities; macros are for #[tokio::test])
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
# Async stream utilities (collecting fetch results)
futures-lite = "2"
# OS keychain (passwords never touch disk in plaintext). ⚠️ v4 + v1 feature; the API is keyring::v1::Entry (not top-level)
keyring = { version = "4", features = ["v1"] }
# Log facade (backend: tauri-plugin-log)
log.workspace = true

[build-dependencies]
tauri-plugin.workspace = true
